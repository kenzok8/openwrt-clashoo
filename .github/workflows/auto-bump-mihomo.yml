name: Auto Bump Mihomo Stable

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '18 2 */3 * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find latest stable release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected stable tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          current=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' clashoo/Makefile)
          if [ -n "$current" ] && [ "$(printf '%s\n' "$current" "${tag#v}" | sort -V | tail -n 1)" = "$current" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin source and create candidate
        if: steps.upstream.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/mihomo-stable-${VERSION}"
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "Candidate PR already exists: $branch"
            exit 0
          fi
          git clone --filter=blob:none --no-checkout https://github.com/MetaCubeX/mihomo.git mihomo-src
          git -C mihomo-src checkout "refs/tags/${TAG}"
          sha=$(git -C mihomo-src rev-parse HEAD)
          short_sha=$(git -C mihomo-src rev-parse --short=7 HEAD)
          subdir="clashoo-stable-${TAG}-${short_sha}"
          tarball="${subdir}.tar.gz"
          ts=$(git -C mihomo-src log -1 --format='%ct' HEAD)
          mkdir -p "pack/${subdir}"
          git -C mihomo-src archive --format=tar HEAD | tar -x -f - -C "pack/${subdir}"
          tar --numeric-owner --owner=0 --group=0 --mode=a-s --sort=name \
            --mtime="@${ts}" -c -C pack "${subdir}" | gzip -nc > "${tarball}"
          hash=$(sha256sum "${tarball}" | cut -d ' ' -f 1)

          # The candidate build downloads this exact immutable source asset.
          existing_digest=$(gh release view mihomo-src --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"$tarball\") | .digest")
          if [ -n "$existing_digest" ] && [ "$existing_digest" != "sha256:${hash}" ]; then
            echo "Source asset digest mismatch: $tarball"
            exit 1
          fi
          if [ -z "$existing_digest" ]; then
            gh release upload mihomo-src "$tarball" --repo "$GITHUB_REPOSITORY"
          fi

          git switch -c "$branch"
          sed -i "s/^PKG_UPSTREAM_VERSION:=.*/PKG_UPSTREAM_VERSION:=${VERSION}/" clashoo/Makefile
          sed -i "s/^PKG_SHORT_SHA:=.*/PKG_SHORT_SHA:=${short_sha}/" clashoo/Makefile
          sed -i "s|^PKG_VERSION:=.*|PKG_VERSION:=$(TZ=Asia/Shanghai date +%Y.%m.%d).\$(PKG_UPSTREAM_VERSION)|" clashoo/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" clashoo/Makefile
          sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=${sha}/" clashoo/Makefile
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${hash}/" clashoo/Makefile
          git add clashoo/Makefile
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: bump mihomo stable to ${TAG}"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore: bump mihomo stable to ${TAG}" \
            --body "Pin the mihomo stable source to ${TAG}. Review the package matrix and upgrade checks before merging."
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f build_only=true
