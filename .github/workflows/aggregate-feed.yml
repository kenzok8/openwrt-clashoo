name: Aggregate Unified Feed

# run-name 会出现在 run 的 display_title 里，daede 的 promote gate 靠它认领
# 自己派发的那次聚合，而不是只按时间窗口猜。
run-name: Aggregate Unified Feed · ${{ inputs.candidate_sha || 'manual' }} · ${{ inputs.build_run_id || '' }} · ${{ inputs.dispatch_id || '' }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Expected daede candidate commit (optional for manual runs)'
        type: string
      build_run_id:
        description: 'Expected daede build run (optional for manual runs)'
        type: string
      dispatch_id:
        description: 'Unique id from the daede promote gate (echoed in run-name)'
        type: string
  schedule:
    - cron: '37 4 * * *'

# Shared with prune-feed: the two must never overlap on the bucket.
concurrency:
  group: feed-pipeline
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aggregate:
    name: Merge and sign feed
    runs-on: ubuntu-latest

    steps:
      - name: Prepare rclone
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          [ -z "$R2_ACCESS_KEY_ID" ] && { echo "No R2 credentials"; exit 1; }
          timeout 120 curl -fsSL https://rclone.org/install.sh -o /tmp/rclone-install.sh && sudo bash /tmp/rclone-install.sh
          command -v rclone >/dev/null || { echo "rclone install failed"; exit 1; }
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          no_check_bucket = true
          EOF

      - name: Download project feeds
        id: download
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          EXPECTED_DAEDE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_DAEDE_RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [ -z "$R2_BUCKET" ] && { echo "No R2 bucket"; exit 1; }
          if [ -n "$EXPECTED_DAEDE_SHA" ] || [ -n "$EXPECTED_DAEDE_RUN" ]; then
            [[ "$EXPECTED_DAEDE_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_DAEDE_RUN" =~ ^[0-9]+$ ]] || {
              echo "Invalid daede candidate identity"; exit 1;
            }
          fi

          # No-change guard: if none of the five project feeds changed since
          # the last successful aggregate, skip the rest of the job. The
          # fingerprint is written by the upload step only after a full
          # successful sync, so a failed run never records a fingerprint.
          # Candidate runs (daede promote gate) always do full work: the gate
          # needs the manifest verification below to run.
          if [ -z "$EXPECTED_DAEDE_SHA" ] && [ -z "$EXPECTED_DAEDE_RUN" ]; then
            if rclone cat "r2:${R2_BUCKET}/openwrt-feed/aggregate-fingerprint.txt" > /tmp/prev-fingerprint.txt 2>/dev/null; then
              {
                for p in clashoo daed jell tower honk; do
                  rclone ls "r2:${R2_BUCKET}/openwrt-feed/${p}/" 2>/dev/null | awk -v p="$p" '{print p"/"$2, $1}' || true
                done
              } | sort > /tmp/cur-fingerprint.txt
              if cmp -s /tmp/prev-fingerprint.txt /tmp/cur-fingerprint.txt; then
                echo "No feed changes since last aggregate, skipping."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          mkdir -p aggregate/clashoo aggregate/daed aggregate/jell aggregate/tower aggregate/honk merged
          # --stats-log-level NOTICE: the default INFO level hides the periodic
          # stats lines in the Actions log, which left past runs with no
          # bandwidth data at all. --transfers 32 is the main lever here;
          # --multi-thread-streams only helps single files over 256 MB, which
          # these packages are not, so it is intentionally not set. The five
          # copies stay sequential: one --transfers 32 stream gives a clean
          # bandwidth reading, and the runner's egress is the shared cap.
          RCLONE_FLAGS=(--fast-list --transfers 32 --checkers 32 --stats 30s --stats-one-line --stats-log-level NOTICE)
          rclone copy "r2:${R2_BUCKET}/openwrt-feed/clashoo/" aggregate/clashoo/ "${RCLONE_FLAGS[@]}" || true
          rclone copy "r2:${R2_BUCKET}/openwrt-feed/daed/" aggregate/daed/ "${RCLONE_FLAGS[@]}"
          rclone copy "r2:${R2_BUCKET}/openwrt-feed/jell/" aggregate/jell/ "${RCLONE_FLAGS[@]}" || true
          rclone copy "r2:${R2_BUCKET}/openwrt-feed/tower/" aggregate/tower/ "${RCLONE_FLAGS[@]}" || true
          rclone copy "r2:${R2_BUCKET}/openwrt-feed/honk/" aggregate/honk/ "${RCLONE_FLAGS[@]}" || true

          # New daede releases provide a byte-for-byte feed manifest. Older
          # releases remain readable during the transition.
          manifest=aggregate/daed/release-manifest.json
          if [ -f "$manifest" ]; then
            jq -e '.candidate_sha | test("^[0-9a-f]{40}$")' "$manifest" >/dev/null
            if [ -n "$EXPECTED_DAEDE_SHA" ]; then
              jq -e --arg sha "$EXPECTED_DAEDE_SHA" --argjson run "$EXPECTED_DAEDE_RUN" \
                '.candidate_sha == $sha and .build_run_id == $run' "$manifest" >/dev/null
            fi
            jq -e '[.files[] | select(.path | startswith("feed/"))] | length > 0' "$manifest" >/dev/null
            jq -r '.files[] | select(.path | startswith("feed/")) | [.path, .sha256] | @tsv' "$manifest" |
              while IFS=$'\t' read -r path expected; do
                file="aggregate/daed/${path#feed/}"
                [ -f "$file" ] || { echo "Missing daede feed file: $path"; exit 1; }
                actual=$(sha256sum "$file" | cut -d' ' -f1)
                [ "$actual" = "$expected" ] || { echo "Daede feed hash mismatch: $path"; exit 1; }
              done
          elif [ -n "$EXPECTED_DAEDE_SHA" ]; then
            echo "Expected daede candidate manifest is missing"
            exit 1
          fi

          # Copy daed last so its verified candidate wins an exact filename
          # collision with jell (notably luci-app-daede).
          for project in clashoo jell tower honk daed; do
            [ -d "aggregate/${project}" ] || continue
            find "aggregate/${project}" -mindepth 2 -maxdepth 2 -type d | while read -r dir; do
              sdk=$(basename "$(dirname "$dir")")
              arch=$(basename "$dir")
              target="merged/${sdk}/${arch}"
              mkdir -p "$target"
              # Same filesystem (both under $PWD), so mv is a rename: no data
              # copy, no per-file log spam. Batched (-exec ... {} +) so this
              # is a handful of mv processes, not one per file (~16k before).
              find "$dir" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -exec mv -t "$target/" {} +
            done
          done

          # Two project feeds can ship the same package at different versions
          # (jell trails daed, say). Keep only the highest per arch, so the
          # index never lists a build that prune-feed later drops upstream.
          find merged -type f \( -name '*.apk' -o -name '*.ipk' \) \
          | awk '
              function key(p,   n,seg,fn,dir,a,i,k,t) {
                n = split(p, seg, "/"); fn = seg[n]
                dir = ""; for (i = 1; i < n; i++) dir = dir seg[i] "/"
                if (fn ~ /\.ipk$/) {
                  n = split(fn, a, "_")
                  if (n >= 3) { k = a[1]; for (i = 3; i <= n; i++) k = k "_" a[i]; return dir k }
                  return dir fn
                }
                t = fn
                sub(/\.apk$/, "", t)
                sub(/-r[0-9]+$/, "", t)
                sub(/-[^-]+$/, "", t)
                return dir t
              }
              { print key($0) "\t" $0 }
            ' \
          | sort -t$'\t' -k1,1 -k2,2V \
          | awk -F'\t' '
              { if (NR > 1 && $1 == prevkey) print prevpath; prevkey = $1; prevpath = $2 }
            ' \
          | while IFS= read -r stale; do echo "superseded: $stale"; rm -f "$stale"; done

          if [ -f "$manifest" ] && [ -n "$EXPECTED_DAEDE_SHA" ]; then
            jq -r '.files[] | select((.path | startswith("feed/")) and (.path | test("\\.(apk|ipk)$"))) | [.path, .sha256] | @tsv' "$manifest" |
              while IFS=$'\t' read -r path expected; do
                file="merged/${path#feed/}"
                [ -f "$file" ] || { echo "Candidate package missing from merged feed: $path"; exit 1; }
                actual=$(sha256sum "$file" | cut -d' ' -f1)
                [ "$actual" = "$expected" ] || { echo "Merged candidate package differs: $path"; exit 1; }
              done
          fi

          find merged -type f | sort
          find merged -type f -print -quit | grep -q . || { echo "No packages to aggregate"; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Generate signed indexes
        if: steps.download.outputs.changed == 'true'
        env:
          KEY_BUILD: ${{ secrets.OPKG_KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          [ -z "$KEY_BUILD" ] && { echo "No OPKG signing key"; exit 1; }
          [ -z "$PRIVATE_KEY" ] && { echo "No APK signing key"; exit 1; }
          printf '%s\n' "$KEY_BUILD" > key-build
          printf '%s\n' "$PRIVATE_KEY" > private-key.pem
          chmod -R a+w merged/

          echo "=== [1/3] clone gh-action-sdk ==="
          timeout 300 git clone --depth 1 https://github.com/openwrt/gh-action-sdk.git sdk-action || {
            echo "clone failed, retrying once..."
            rm -rf sdk-action
            timeout 300 git clone --depth 1 https://github.com/openwrt/gh-action-sdk.git sdk-action
          }
          echo "=== [2/3] docker build sdk-tools ==="
          timeout --kill-after=60 600 docker build --progress=plain -t sdk-tools --build-arg ARCH=x86_64-openwrt-25.12 sdk-action || {
            echo "docker build failed, retrying once..."
            timeout --kill-after=60 600 docker build --progress=plain -t sdk-tools --build-arg ARCH=x86_64-openwrt-25.12 sdk-action
          }
          echo "=== [3/3] generate indexes ==="
          timeout --kill-after=60 1200 docker run --rm --user root --entrypoint bash \
            -v "$PWD/merged":/work \
            -v "$PWD/key-build":/keys/key-build:ro \
            -v "$PWD/private-key.pem":/keys/private-key.pem:ro \
            sdk-tools -c '
              set -eu
              mkdir -p /artifacts && chmod 777 /artifacts
              echo "--- setup.sh (SDK unpack) ---"
              bash setup.sh
              export PATH="$PWD/staging_dir/host/bin:$PATH"
              if [ ! -x "$PWD/staging_dir/host/bin/sha256" ]; then
                printf "#!/bin/sh\nexec mkhash sha256 \"\$@\"\n" > "$PWD/staging_dir/host/bin/sha256"
                chmod +x "$PWD/staging_dir/host/bin/sha256"
              fi
              export SDK_DIR="$PWD"
              cat > /tmp/index-one.sh <<\EOS
              #!/bin/bash
              set -eu
              dir="$1"
              cd "$dir" || exit 1
              apk_count=$(ls ./*.apk 2>/dev/null | wc -l)
              ipk_count=$(ls ./*.ipk 2>/dev/null | wc -l)
              echo "==> $dir  APK=$apk_count IPK=$ipk_count"
              if [ "$apk_count" -gt 0 ]; then
                rm -f packages.adb packages.adb.* APKINDEX*
                "$SDK_DIR/staging_dir/host/bin/apk" mkndx --allow-untrusted --sign-key /keys/private-key.pem --output packages.adb ./*.apk
                echo "  APK: packages.adb $(wc -c < packages.adb) bytes"
              fi
              if [ "$ipk_count" -gt 0 ]; then
                rm -f Packages Packages.gz Packages.sig
                "$SDK_DIR/scripts/ipkg-make-index.sh" . > Packages
                gzip -9nc Packages > Packages.gz
                "$SDK_DIR/staging_dir/host/bin/usign" -S -m Packages -s /keys/key-build
                echo "  IPK: Packages.gz $(wc -c < Packages.gz) bytes, signed"
              fi
              EOS
              chmod +x /tmp/index-one.sh
              echo "--- indexing all sdk/arch dirs, 4 parallel ---"
              printf "%s\n" /work/[0-9]*/* | xargs -P4 -I{} /tmp/index-one.sh {}
            '

      - name: Prepare keys and upload
        if: steps.download.outputs.changed == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPKG_PUB_KEY: ${{ secrets.OPKG_PUB_KEY }}
          APK_PUB_KEY: ${{ secrets.APK_PUB_KEY }}
        run: |
          set -euo pipefail
          echo "=== Index files generated ==="
          find merged \( -name "packages.adb" -o -name "Packages.gz" -o -name "Packages.sig" \) | sort
          mkdir -p merged/keys
          printf '%s\n' "$OPKG_PUB_KEY" > merged/keys/dllkids-feed.pub
          printf '%s\n' "$APK_PUB_KEY" > merged/keys/dllkids-feed.pub.pem

          rclone copy merged/keys/ "r2:${R2_BUCKET}/openwrt-feed/keys/" --checksum --fast-list --stats 30s --stats-one-line --stats-log-level NOTICE

          dirs=()
          while IFS= read -r d; do dirs+=("$d"); done < <(find merged -mindepth 2 -maxdepth 2 -type d)
          for dir in "${dirs[@]}"; do
            sdk=$(basename "$(dirname "$dir")")
            arch=$(basename "$dir")
            [ "$sdk" = "keys" ] && continue
            echo "Uploading ${sdk}/${arch} ..."
            rclone sync "$dir/" "r2:${R2_BUCKET}/openwrt-feed/${sdk}/${arch}/" --checksum --fast-list --transfers 8 --checkers 16 --stats 30s --stats-one-line --stats-log-level NOTICE
            echo "  -> done"
          done

          # Record the source fingerprint for the next run's no-change guard.
          # Only written after a full successful upload.
          {
            for p in clashoo daed jell tower honk; do
              rclone ls "r2:${R2_BUCKET}/openwrt-feed/${p}/" 2>/dev/null | awk -v p="$p" '{print p"/"$2, $1}' || true
            done
          } | sort > /tmp/aggregate-fingerprint.txt
          rclone copy /tmp/aggregate-fingerprint.txt "r2:${R2_BUCKET}/openwrt-feed/" --checksum
          echo "Fingerprint recorded."

      - name: Verify R2 upload
        if: steps.download.outputs.changed == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "Checking keys ..."
          rclone lsf "r2:${R2_BUCKET}/openwrt-feed/keys/" --files-only > /dev/null || { echo "FAIL: no keys"; exit 1; }
          echo "  -> OK"

          fail=0
          for dir in merged/*/*; do
            [ -d "$dir" ] || continue
            sdk=$(basename "$(dirname "$dir")")
            arch=$(basename "$dir")
            [ "$sdk" = "keys" ] && continue

            echo "Checking ${sdk}/${arch} ..."
            if rclone lsf "r2:${R2_BUCKET}/openwrt-feed/${sdk}/${arch}/" --files-only > /dev/null 2>&1; then
              echo "  -> OK"
            else
              echo "  -> FAIL"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "Verification FAILED"
            exit 1
          fi
          echo "All R2 paths verified OK"
